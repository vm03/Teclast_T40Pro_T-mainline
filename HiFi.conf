SectionVerb {
        EnableSequence [
                cset "name='TX0 SEL' IIS0"
                cset "name='RX0 SEL' IIS1"

                cset "name='FE_FAST_PLAYBACK TX Switch' on"
                cset "name='FE_CAPTURE_DSP RX Switch' on"
        ]

        DisableSequence [
                cset "name='FE_CAPTURE_DSP RX Switch' off"
                cset "name='FE_FAST_PLAYBACK TX Switch' off"
        ]
}

SectionDevice."Headphones" {
        Comment "Headphones playback"

        ConflictingDevices [
                "Earpiece"
                "Speaker"
        ]

        EnableSequence [
                cset "name='TX0 MIXER0 Mode' NOT_MIX"
                cset "name='Headphone Playback Switch' on"
                cset "name='Headphone Volume' 9"
                cset "name='aw87xxx_profile_switch_0' 0"
                cset "name='aw87xxx_profile_switch_3' 0"
                cset "name='aw87xxx_profile_switch_1' 0"
                cset "name='aw87xxx_profile_switch_2' 0"
        ]

        DisableSequence [
                cset "name='aw87xxx_profile_switch_0' 1"
                cset "name='aw87xxx_profile_switch_3' 1"
                cset "name='aw87xxx_profile_switch_1' 1"
                cset "name='aw87xxx_profile_switch_2' 1"
                cset "name='Headphone Volume' 0"
                cset "name='Headphone Playback Switch' off"
        ]

        Value {
                PlaybackPriority 300
                PlaybackChannels 2
                PlaybackPCM "hw:${CardId},0"
        }
}

SectionDevice."Speaker" {
        Comment "Speaker playback"

        ConflictingDevices [
                "Earpiece"
                "Headphones"
        ]

        EnableSequence [
                cset "name='TX0 MIXER0 Mode' HALF_ADD"
                cset "name='Headphone Playback Switch' on"
                cset "name='Headphone Volume' 9"
                cset "name='Speaker Switch' on"
                cset "name='aw87xxx_profile_switch_0' 0"
                cset "name='aw87xxx_profile_switch_3' 0"
                cset "name='aw87xxx_profile_switch_1' 0"
                cset "name='aw87xxx_profile_switch_2' 0"
        ]

        DisableSequence [
                cset "name='Headphone Volume' 0"
                cset "name='Headphone Playback Switch' off"
                cset "name='Speaker Switch' off"
                cset "name='aw87xxx_profile_switch_0' 1"
                cset "name='aw87xxx_profile_switch_3' 1"
                cset "name='aw87xxx_profile_switch_1' 1"
                cset "name='aw87xxx_profile_switch_2' 1"
        ]

        Value {
                PlaybackPriority 200
                PlaybackChannels 2
                PlaybackPCM "hw:${CardId},0"
        }
}

SectionDevice."Earpiece" {
        Comment "Earpiece playback"

        ConflictingDevices [
                "Headphones"
                "Speaker"
        ]

        EnableSequence [
                cset "name='TX0 MIXER0 Mode' HALF_ADD"
                cset "name='Earpiece Playback Switch' on"
                cset "name='Earpiece Volume' 11"
        ]

        DisableSequence [
                cset "name='Earpiece Volume' 0"
                cset "name='Earpiece Playback Switch' off"
        ]

        Value {
                PlaybackPriority 100
                PlaybackChannels 2
                PlaybackPCM "hw:${CardId},0"
        }
}

SectionDevice."Mic" {
        Comment "Microphone capture"

        ConflictingDevices [
                "Headset"
        ]

        EnableSequence [
                cset "name='ADCL Mixer MIC' on"
                cset "name='Capture Volume' 7"
        ]

        DisableSequence [
                cset "name='ADCL Mixer MIC' off"
        ]

        Value {
                CapturePriority 200
        }

        Macro.pcm_split.SplitPCMDevice {
                Name "ums9230_mono_in"
                Device 1
                Direction Capture
                HWChannels 2
                Channels 1
                Channel0 0
                ChannelPos0 MONO
        }
}

SectionDevice."Headset" {
        Comment "Headset capture"

        ConflictingDevices [
                "Mic"
        ]

        EnableSequence [
                cset "name='ADCL Mixer HPMIC' on"
                cset "name='Capture Volume' 7"
        ]

        DisableSequence [
                cset "name='ADCL Mixer HPMIC' off"
        ]

        Value {
                CapturePriority 300
        }

        Macro.pcm_split.SplitPCMDevice {
                Name "ums9230_mono_in"
                Device 1
                Direction Capture
                HWChannels 2
                Channels 1
                Channel0 0
                ChannelPos0 MONO
        }
}
